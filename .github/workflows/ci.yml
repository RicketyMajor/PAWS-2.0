name: PAWS Backend CI/CD Pipeline

# -------------------
# Triggers
# -------------------
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # -------------------
  # Job 1: Code Quality & Security Gate
  # -------------------
  quality-gate:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10" 

      - name: Install Linter natively
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run Linter
        run: golangci-lint run --timeout=5m

      - name: Install Vulnerability Scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Vulnerability Check
        run: govulncheck ./...

      - name: Run Unit Tests
        run: go test -v ./...

  # -------------------
  # Job 2: Build & Push Docker Image
  # -------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: quality-gate # This job runs only if 'quality-gate' succeeds
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Run only on push events, not pull requests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/paws-backend:latest, ${{ secrets.DOCKER_USERNAME }}/paws-backend:${{ github.sha }}
