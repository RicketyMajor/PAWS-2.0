name: paws_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

# -------------------
# Environment
# -------------------
environment:
  sdk: ^3.10.4

# -------------------
# Dependencies
# -------------------
dependencies:
  flutter:
    sdk: flutter

  # UI & Style
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  lottie: ^3.1.0
  flutter_card_swiper: ^7.2.0
  cached_network_image: ^3.4.1

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  provider: ^6.1.1
  get_it: ^7.6.0
  equatable: ^2.0.7
  go_router: ^17.0.1

  # Core & Utils
  dio: ^5.9.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.1
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  
  # Device & Hardware
  geolocator: ^10.1.0
  
  # Firebase
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0

# -------------------
# Dev Dependencies
# -------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"


# -------------------
# Flutter Settings
# -------------------
flutter:
  uses-material-design: true
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

# -------------------
# Launcher Icon Settings
# -------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21