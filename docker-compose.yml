version: '3.8'

services:
  # -------------------
  # PostgreSQL Database
  # -------------------
  db:
    image: postgres:15-alpine
    container_name: paws-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paws-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -------------------
  # Redis Cache
  # -------------------
  redis:
    image: redis:alpine
    container_name: paws-redis
    restart: always
    ports:
      - "6379:6379"

  # -------------------
  # MinIO Storage
  # -------------------
  minio:
    image: minio/minio
    container_name: paws-minio
    restart: always
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # -------------------
  # Backend Application
  # -------------------
  backend:
    build: .
    container_name: paws-backend
    restart: always
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      
      # --- Database Config ---
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: paws-db
      DB_SSL_MODE: disable
      
      # --- Redis Config ---
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # --- Security ---
      JWT_SECRET: "tu_secreto"

      # --- Email ---
      # Sin credenciales de Brevo el envio es un fallo duro, asi que el stack local
      # simula: el codigo OTP se imprime en los logs del contenedor.
      EMAIL_SIMULATION: "true"

      # --- MinIO Storage Config ---
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: paws-bucket
      MINIO_USE_SSL: "false"
      
      # Public URL for storage access
      STORAGE_PUBLIC_URL: http://10.0.2.2:9000 

# -------------------
# Volumes
# -------------------
volumes:
  postgres_data:
  minio_data: