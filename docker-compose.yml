version: '3.8'

services:
  # 1. BASE DE DATOS (Igual que antes)
  db:
    image: postgres:15-alpine
    container_name: paws-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paws-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. CACHÉ (REDIS) (Igual que antes)
  redis:
    image: redis:alpine
    container_name: paws-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. ALMACENAMIENTO (MINIO) - TU BLOQUE ESTABA PERFECTO
  minio:
    image: minio/minio
    container_name: paws-minio
    restart: always
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola Web
    environment:
      MINIO_ROOT_USER: minioadmin      # Usuario maestro
      MINIO_ROOT_PASSWORD: minioadmin  # Contraseña maestra
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. BACKEND (AQUÍ ESTÁ EL CAMBIO IMPORTANTE)
  backend:
    build: .
    container_name: paws-backend
    restart: always
    depends_on:
      - db
      - redis
      - minio  # <--- Agregamos dependencia para que espere a MinIO
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      
      # --- Base de Datos ---
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: paws-db
      DB_SSL_MODE: disable
      
      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # --- SEGURIDAD ---
      JWT_SECRET: "tu_secreto"

      # --- NUEVO: CONFIGURACIÓN MINIO (Para cuando corre en Docker) ---
      # Nota: Dentro de Docker, el host es el nombre del servicio: "minio"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin  # Debe coincidir con MINIO_ROOT_USER de arriba
      MINIO_SECRET_KEY: minioadmin  # Debe coincidir con MINIO_ROOT_PASSWORD de arriba
      MINIO_BUCKET: paws-bucket
      MINIO_USE_SSL: "false"
      
      # URL Pública: Para emulador Android usa 10.0.2.2, para Web usa localhost
      STORAGE_PUBLIC_URL: http://10.0.2.2:9000 

volumes:
  postgres_data:
  minio_data: