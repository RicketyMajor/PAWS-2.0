services:
  # -------------------
  # PostgreSQL Database
  # -------------------
  db:
    image: postgres:15-alpine
    container_name: paws-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paws-db
    # Sin publicar al host a propósito: el backend llega por la red de compose y el
    # arnés lee Redis con `docker compose exec`. Publicarlo solo sirve para chocar
    # con el Postgres que ya corre en la máquina.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paws-db"]
      interval: 2s
      timeout: 3s
      retries: 20

  # -------------------
  # Redis Cache
  # -------------------
  redis:
    image: redis:alpine
    container_name: paws-redis
    restart: always

  # -------------------
  # Backend Application
  # -------------------
  backend:
    build: .
    container_name: paws-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      
      # --- Database and cache ---
      # Written out in full, NEVER as ${DATABASE_URL}: compose interpolates that from
      # .env, which points at Supabase and Upstash. An accidental ${...} here would aim
      # the local stack at production.
      DATABASE_URL: "postgres://postgres:password@db:5432/paws-db?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"

      # --- Security ---
      # Local only. Production keeps its own secret in Render.
      JWT_SECRET: "local-development-secret-not-used-anywhere-else"

      # --- Email ---
      # Sin credenciales de Brevo el envio es un fallo duro, asi que el stack local
      # simula: el codigo OTP se imprime en los logs del contenedor.
      EMAIL_SIMULATION: "true"

      # --- Storage ---
      # The only value taken from .env on purpose. With it the walkthrough exercises the
      # real upload path; without it FileService degrades and the image checks are
      # skipped, which the harness reports rather than failing on.
      CLOUDINARY_URL: "${CLOUDINARY_URL:-}"

# -------------------
# Volumes
# -------------------
volumes:
  postgres_data: